<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>New load absorbed against curtailment accepted</title>
<rect width="760" height="400" fill="#fcfcfb"/>
<text x="24" y="30" font-size="20" font-weight="600" fill="#0b0b0b">The trade nobody is allowed to make</text>
<text x="24" y="50" font-size="14" fill="#52514e">New load existing US grids could absorb, against how much curtailment the load accepts in exchange.</text>
<line x1="250.0" y1="106" x2="250.0" y2="260" stroke="#e2e1dd" stroke-width="1"/>
<text x="250.0" y="278" font-size="12.5" text-anchor="middle" fill="#52514e">0</text>
<line x1="307.1" y1="106" x2="307.1" y2="260" stroke="#e2e1dd" stroke-width="1"/>
<text x="307.1" y="278" font-size="12.5" text-anchor="middle" fill="#52514e">20</text>
<line x1="364.3" y1="106" x2="364.3" y2="260" stroke="#e2e1dd" stroke-width="1"/>
<text x="364.3" y="278" font-size="12.5" text-anchor="middle" fill="#52514e">40</text>
<line x1="421.4" y1="106" x2="421.4" y2="260" stroke="#e2e1dd" stroke-width="1"/>
<text x="421.4" y="278" font-size="12.5" text-anchor="middle" fill="#52514e">60</text>
<line x1="478.6" y1="106" x2="478.6" y2="260" stroke="#e2e1dd" stroke-width="1"/>
<text x="478.6" y="278" font-size="12.5" text-anchor="middle" fill="#52514e">80</text>
<line x1="535.7" y1="106" x2="535.7" y2="260" stroke="#e2e1dd" stroke-width="1"/>
<text x="535.7" y="278" font-size="12.5" text-anchor="middle" fill="#52514e">100</text>
<line x1="592.9" y1="106" x2="592.9" y2="260" stroke="#e2e1dd" stroke-width="1"/>
<text x="592.9" y="278" font-size="12.5" text-anchor="middle" fill="#52514e">120</text>
<line x1="650.0" y1="106" x2="650.0" y2="260" stroke="#e2e1dd" stroke-width="1"/>
<text x="650.0" y="278" font-size="12.5" text-anchor="middle" fill="#52514e">140</text>
<text x="450.0" y="298" font-size="13" text-anchor="middle" fill="#52514e">gigawatts of new load absorbed</text>
<text x="234" y="137" font-size="15.5" font-weight="600" text-anchor="end" fill="#0b0b0b">0.25% of annual energy</text>
<text x="234" y="154" font-size="12" text-anchor="end" fill="#52514e">about 85 hours affected</text>
<path d="M250,116 H463.1428571428571 a4,4 0 0 1 4,4 V158 a4,4 0 0 1 -4,4 H250 Z" fill="#2a78d6"/>
<text x="477.1" y="146" font-size="15.5" font-weight="600" fill="#0b0b0b">76 GW</text>
<text x="234" y="227" font-size="15.5" font-weight="600" text-anchor="end" fill="#0b0b0b">1% of annual energy</text>
<text x="234" y="244" font-size="12" text-anchor="end" fill="#52514e">proportionally more hours</text>
<path d="M250,206 H606.0 a4,4 0 0 1 4,4 V248 a4,4 0 0 1 -4,4 H250 Z" fill="#2a78d6"/>
<text x="620.0" y="236" font-size="15.5" font-weight="600" fill="#0b0b0b">126 GW</text>
<line x1="295.7" y1="94" x2="295.7" y2="254" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="302.7" y="89" font-size="12" font-weight="600" fill="#eb6834">Alberta&#8217;s entire queue, 16 GW</text>
<text x="24" y="336" font-size="12" fill="#52514e">Source: Duke University Nicholas Institute, Rethinking Load Growth. The 22 largest US balancing areas, about 95 per cent of US</text>
<text x="24" y="349" font-size="12" fill="#52514e">load, could absorb 76 GW at 0.25 per cent annual energy curtailment and 126 GW at 1 per cent. The authors describe this as a</text>
<text x="24" y="362" font-size="12" fill="#52514e">first-order estimate that does not model transmission constraints: technical headroom, not committed flexibility. Curtailment is</text>
<text x="24" y="375" font-size="12" fill="#52514e">partial, and for 88 per cent of it half the load keeps running, so more hours are touched than the energy share alone implies:</text>
<text x="24" y="388" font-size="12" fill="#52514e">the study puts the 0.25 per cent case at roughly 85 hours a year. No hours figure is published for the 1 per cent case.</text>
</svg>