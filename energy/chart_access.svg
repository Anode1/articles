<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>How large-load electricity access is granted in four provinces</title>
<rect width="760" height="478" fill="#fcfcfb"/>
<text x="24" y="30" font-size="20" font-weight="600" fill="#0b0b0b">Four provinces, four ways of not naming a price</text>
<text x="24" y="50" font-size="14" fill="#52514e">How a large load obtains grid access. In none of the four is the answer a number you can plan around.</text>
<line x1="96" y1="170" x2="692" y2="170" stroke="#e2e1dd" stroke-width="2"/>
<text x="96" y="124" font-size="13" font-weight="600" fill="#52514e">a transaction</text>
<text x="96.0" y="141" font-size="11.5" text-anchor="start" fill="#52514e">anyone who pays the posted</text>
<text x="96.0" y="154" font-size="11.5" text-anchor="start" fill="#52514e">price connects</text>
<text x="692" y="124" font-size="13" font-weight="600" text-anchor="end" fill="#52514e">a permission</text>
<text x="692.0" y="141" font-size="11.5" text-anchor="end" fill="#52514e">someone decides whether</text>
<text x="692.0" y="154" font-size="11.5" text-anchor="end" fill="#52514e">you may connect at all</text>
<circle cx="96" cy="170" r="7" fill="none" stroke="#b9b8b3" stroke-width="2" stroke-dasharray="3 2.5"/>
<text x="96" y="196" font-size="11.5" font-weight="600" text-anchor="start" fill="#b9b8b3">no Canadian jurisdiction</text>
<line x1="274.8" y1="178" x2="274.8" y2="184" stroke="#b9b8b3" stroke-width="1"/>
<circle cx="274.8" cy="170" r="7.5" fill="#2a78d6"/>
<text x="274.8" y="200" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">QUEBEC</text>
<text x="274.8" y="216" font-size="12" font-weight="600" text-anchor="middle" fill="#2a78d6">posted price, by decree</text>
<text x="274.8" y="233" font-size="11.5" text-anchor="middle" fill="#52514e">13c/kWh above 5 MW,</text>
<text x="274.8" y="246" font-size="11.5" text-anchor="middle" fill="#52514e">roughly double the large-</text>
<text x="274.8" y="259" font-size="11.5" text-anchor="middle" fill="#52514e">customer rate</text>
<text x="274.8" y="274" font-size="11" font-style="italic" text-anchor="middle" fill="#b9b8b3">proposed, hearing autumn 2026</text>
<line x1="405.9" y1="178" x2="405.9" y2="284" stroke="#b9b8b3" stroke-width="1"/>
<circle cx="405.9" cy="170" r="7.5" fill="#eb6834"/>
<text x="405.9" y="300" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">ALBERTA</text>
<text x="405.9" y="316" font-size="12" font-weight="600" text-anchor="middle" fill="#eb6834">quantity cap</text>
<text x="405.9" y="333" font-size="11.5" text-anchor="middle" fill="#52514e">1.2 GW interim limit,</text>
<text x="405.9" y="346" font-size="11.5" text-anchor="middle" fill="#52514e">fully subscribed;</text>
<text x="405.9" y="359" font-size="11.5" text-anchor="middle" fill="#52514e">permanent rules in design</text>
<text x="405.9" y="374" font-size="11" font-style="italic" text-anchor="middle" fill="#b9b8b3">in force, Phase 2 under way</text>
<line x1="519.2" y1="178" x2="519.2" y2="184" stroke="#b9b8b3" stroke-width="1"/>
<circle cx="519.2" cy="170" r="7.5" fill="#eb6834"/>
<text x="519.2" y="200" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">BRITISH COLUMBIA</text>
<text x="519.2" y="216" font-size="12" font-weight="600" text-anchor="middle" fill="#eb6834">quantity plus contest</text>
<text x="519.2" y="233" font-size="11.5" text-anchor="middle" fill="#52514e">100 MW conventional,</text>
<text x="519.2" y="246" font-size="11.5" text-anchor="middle" fill="#52514e">300 MW AI over two years,</text>
<text x="519.2" y="259" font-size="11.5" text-anchor="middle" fill="#52514e">awarded by competition</text>
<text x="519.2" y="274" font-size="11" font-style="italic" text-anchor="middle" fill="#b9b8b3">in force 1 February 2026</text>
<line x1="656.2" y1="178" x2="642.0" y2="284" stroke="#b9b8b3" stroke-width="1"/>
<circle cx="656.2" cy="170" r="7.5" fill="#eb6834"/>
<text x="642.0" y="300" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">ONTARIO</text>
<text x="642.0" y="316" font-size="12" font-weight="600" text-anchor="middle" fill="#eb6834">ministerial discretion</text>
<text x="642.0" y="333" font-size="11.5" text-anchor="middle" fill="#52514e">Bill 40 contemplates</text>
<text x="642.0" y="346" font-size="11.5" text-anchor="middle" fill="#52514e">approval of connections;</text>
<text x="642.0" y="359" font-size="11.5" text-anchor="middle" fill="#52514e">no regulations made</text>
<text x="642.0" y="374" font-size="11" font-style="italic" text-anchor="middle" fill="#b9b8b3">framework only, criteria unwritten</text>
<text x="24" y="427" font-size="12" fill="#52514e">Placement along the scale is this article&#x27;s characterisation of each mechanism, not a measured quantity. Sources for the</text>
<text x="24" y="440" font-size="12" fill="#52514e">mechanisms themselves: BC Data Centre Facility and Hydrogen Production Facility Power Supply Regulation, in force 1 Feb 2026.</text>
<text x="24" y="453" font-size="12" fill="#52514e">AESO interim approach to large load connections, 4 June 2025, 1,200 MW through 2028. Hydro-Quebec application to the Regie de</text>
<text x="24" y="466" font-size="12" fill="#52514e">l&#x27;energie, 13c/kWh above 5 MW, hearing autumn 2026. Ontario Bill 40, royal assent 11 December 2025; regulations not yet made.</text>
</svg>